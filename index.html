<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#F1F5F9" />
<title>ورود به سایت</title>

<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  :root {
    --bg: #F1F5F9;
    --surface: #FFFFFF;
    --surface-soft: #F8FAFC;
    --line: #E2E8F0;
    --text: #0F172A;
    --text-soft: #475569;
    --text-muted: #94A3B8;
    --primary: #1E40AF;
    --primary-dark: #1E3A8A;
    --primary-light: #EFF6FF;
    --info-bg: #EFF6FF;
    --info-border: #BFDBFE;
    --info-text: #1E3A8A;
    --radius: 16px;
    --shadow-sm: 0 1px 3px rgba(15, 23, 42, .06);
    --shadow-md: 0 14px 34px -12px rgba(30, 64, 175, .45);
  }

  html {
    -webkit-text-size-adjust: 100%;
  }

  body {
    font-family: 'Vazirmatn', Tahoma, system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: calc(24px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom)) 18px;
    line-height: 1.9;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    animation: fade 0.6s ease;
  }

  @keyframes fade {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ===== پیام راهنما (بدون هشدار) ===== */
  .notice {
    text-align: center;
    font-size: clamp(16px, 4.8vw, 18px);
    font-weight: 800;
    line-height: 1.9;
    color: var(--info-text);
    padding: 18px 16px;
    border-radius: var(--radius);
    background: var(--info-bg);
    border: 1.5px solid var(--info-border);
  }

  /* ===== دکمه‌ها ===== */
  .btn {
    width: 100%;
    border: none;
    border-radius: var(--radius);
    font-family: inherit;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .15s ease, filter .2s ease, box-shadow .2s ease;
    padding: 0 18px;
    text-align: center;
    letter-spacing: .2px;
    -webkit-user-select: none;
    user-select: none;
  }

  .btn:active {
    transform: scale(.98);
  }

  /* دکمه اصلی — آبی نفتی */
  .btn-primary {
    min-height: 86px;
    font-size: clamp(21px, 5.8vw, 25px);
    color: #FFFFFF;
    background: linear-gradient(135deg, #2563EB 0%, #1E40AF 50%, #1E3A8A 100%);
    box-shadow: var(--shadow-md), inset 0 1px 0 rgba(255,255,255,.25);
    position: relative;
    overflow: hidden;
  }

  .btn-primary::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,.15) 0%, transparent 55%);
    pointer-events: none;
  }

  .btn-primary:hover {
    filter: brightness(1.06);
  }

  /* دکمه کپی */
  .btn-copy {
    min-height: 68px;
    font-size: clamp(18px, 5vw, 21px);
    color: var(--primary);
    background: var(--surface);
    border: 1.5px solid var(--primary);
    box-shadow: var(--shadow-sm);
  }

  .btn-copy:hover {
    background: #EFF6FF;
  }

  /* ===== کادر آدرس (نمایشی) ===== */
  .url-box {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
    direction: ltr;
    box-shadow: var(--shadow-sm);
    font-family: inherit;
    font-size: clamp(19px, 5.4vw, 23px);
    font-weight: 800;
    color: var(--primary);
    letter-spacing: .5px;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    pointer-events: none;
  }

  /* ===== راهنما ===== */
  .hint {
    font-size: clamp(16px, 4.6vw, 18px);
    color: var(--text-soft);
    line-height: 2;
    text-align: center;
    padding: 0 8px;
  }

  .hint b {
    color: var(--primary);
    font-weight: 800;
  }

  /* ===== Toast ===== */
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(28px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(20px);
    background: var(--primary);
    color: #FFFFFF;
    padding: 14px 28px;
    border-radius: 999px;
    font-size: 16px;
    font-weight: 800;
    opacity: 0;
    pointer-events: none;
    transition: all .3s ease;
    z-index: 999;
    white-space: nowrap;
    box-shadow: 0 8px 24px rgba(30, 64, 175, .4);
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>

<body>

<div class="wrap">

  <p class="notice">
    پیش از ورود، فیلترشکن را خاموش کنید
  </p>

  <button class="btn btn-primary" id="enterBtn">
    ورود به سایت
  </button>

  <div class="url-box" id="urlBox" aria-hidden="true">
    www.Job98.ir
  </div>

  <button class="btn btn-copy" id="copyBtn">
    کپی آدرس سایت
  </button>

  <p class="hint">
    اگر سایت باز نشد:<br>
    روی دکمه کپی بزنید و آدرس سایت را مرورگر گوشی<br>
    (کروم / سافاری) وارد نمایید.
  </p>

</div>

<div class="toast" id="toast">کپی شد</div>

<script>
  /* ===== آدرس سایت ===== */
  var SITE_URL = "https://iran98ir.github.io/Job98/";
  var SITE_URL_CLEAN = "iran98ir.github.io/Job98/";

  var enterBtn = document.getElementById("enterBtn");
  var copyBtn  = document.getElementById("copyBtn");
  var toast    = document.getElementById("toast");

  /* ===== تشخیص محیط ===== */
  function isInstagram() {
    return /Instagram/i.test(navigator.userAgent);
  }

  function isTelegram() {
    return /Telegram/i.test(navigator.userAgent);
  }

  function isAndroid() {
    return /Android/i.test(navigator.userAgent);
  }

  function isIOS() {
    return /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  }

  function isInApp() {
    var ua = navigator.userAgent || "";
    return /Instagram|FBAN|FBAV|FB_IAB|Line|Telegram|Twitter|LinkedIn|WhatsApp|Snapchat|Pinterest|MicroMessenger/i.test(ua);
  }

  /* ===== دکمه ورود ===== */
  enterBtn.addEventListener("click", function () {

    /* --- iOS + Instagram --- */
    if (isIOS() && isInstagram()) {
      var igUrl = "instagram://extbrowser/?url=" + encodeURIComponent(SITE_URL);
      window.location.href = igUrl;

      setTimeout(function () {
        window.location.href = igUrl;
      }, 300);

      setTimeout(function () {
        if (!document.hidden) {
          copyFallback();
        }
      }, 1500);

      return;
    }

    /* --- iOS + Telegram --- */
    if (isIOS() && isTelegram()) {
      var tgUrl = "tg://openurl?url=" + encodeURIComponent(SITE_URL);
      window.location.href = tgUrl;

      setTimeout(function () {
        window.open(SITE_URL, "_blank");
      }, 800);

      return;
    }

    /* --- Android + In-App --- */
    if (isAndroid() && isInApp()) {
      var intentUrl =
        "intent://" +
        SITE_URL.replace(/^https?:\/\//, "") +
        "#Intent;scheme=https;package=com.android.chrome;end";

      window.location.href = intentUrl;

      setTimeout(function () {
        window.location.href = SITE_URL;
      }, 800);

      return;
    }

    /* --- سایر in-app --- */
    if (isInApp()) {
      window.open(SITE_URL, "_blank");
      return;
    }

    /* --- مرورگر معمولی --- */
    window.open(SITE_URL, "_blank");
  });

  /* ===== fallback کپی ===== */
  function copyFallback() {
    var text = SITE_URL_CLEAN;

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        showToast("آدرس کپی شد — در مرورگر باز کنید");
      }).catch(function () {
        manualCopy(text);
      });
    } else {
      manualCopy(text);
    }
  }

  function manualCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.top = "-1000px";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, 99999);
    try {
      document.execCommand("copy");
      showToast("آدرس کپی شد — در مرورگر باز کنید");
    } catch (e) {
      showToast("آدرس: " + text);
    }
    document.body.removeChild(ta);
  }

  /* ===== دکمه کپی ===== */
  copyBtn.addEventListener("click", function () {
    var text = SITE_URL_CLEAN;

    function done() {
      copyBtn.textContent = "کپی شد ✓";
      showToast("آدرس کپی شد");
      setTimeout(function () {
        copyBtn.textContent = "کپی آدرس سایت";
      }, 1800);
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(function () {
        manualCopyDone(text, done);
      });
    } else {
      manualCopyDone(text, done);
    }
  });

  function manualCopyDone(text, cb) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.top = "-1000px";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, 99999);
    try {
      document.execCommand("copy");
      cb();
    } catch (e) {
      showToast("آدرس: " + text);
    }
    document.body.removeChild(ta);
  }

  /* ===== Toast ===== */
  var toastTimer;

  function showToast(msg) {
    if (msg) toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toast.classList.remove("show");
      toast.textContent = "کپی شد";
    }, 2200);
  }

  /* ===== جلوگیری از زوم دو انگشتی ===== */
  document.addEventListener("gesturestart", function (e) {
    e.preventDefault();
  });
</script>

</body>
  </html>
