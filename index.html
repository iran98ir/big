<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#FAF8F3" />
<title>ورود به سایت</title>

<!-- فونت وزیرمتن — همون صفحه دوم -->
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  :root {
    --brand: #C9A227;
    --brand-dark: #A8871F;
    --bg: #FAF8F3;
    --surface: #FFFFFF;
    --text: #1A1A1A;
    --text-muted: #6B6B6B;
    --warn-bg: #FDF8E8;
    --warn-border: #E8D9A8;
    --warn-text: #8B6F1A;
    --radius: 16px;
    --shadow-sm: 0 2px 8px rgba(0,0,0,.05);
    --shadow-md: 0 8px 24px rgba(201,162,39,.28);
  }

  html {
    -webkit-text-size-adjust: 100%;
  }

  body {
    font-family: 'Vazirmatn', Tahoma, system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: calc(24px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom)) 18px;
    line-height: 1.9;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    animation: fade 0.6s ease;
  }

  @keyframes fade {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ===== هشدار فیلترشکن ===== */
  .notice {
    text-align: center;
    font-size: clamp(15px, 4.4vw, 17px);
    font-weight: 700;
    line-height: 1.9;
    color: var(--warn-text);
    padding: 16px 14px;
    border-radius: var(--radius);
    background: var(--warn-bg);
    border: 1px solid var(--warn-border);
  }

  /* ===== دکمه‌ها ===== */
  .btn {
    width: 100%;
    border: none;
    border-radius: var(--radius);
    font-family: inherit;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .15s ease, filter .2s ease, box-shadow .2s ease;
    padding: 0 18px;
    text-align: center;
    letter-spacing: .2px;
    -webkit-user-select: none;
    user-select: none;
  }

  .btn:active {
    transform: scale(.98);
  }

  /* دکمه اصلی — برجسته‌تر از قبل */
  .btn-primary {
    min-height: 76px;
    font-size: clamp(19px, 5.4vw, 23px);
    color: #FFFFFF;
    background: linear-gradient(135deg, #D4A82A 0%, #C9A227 50%, #B8921F 100%);
    box-shadow: 0 10px 28px rgba(201,162,39,.38),
                inset 0 1px 0 rgba(255,255,255,.35);
    position: relative;
    overflow: hidden;
  }

  .btn-primary::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,.18) 0%, transparent 55%);
    pointer-events: none;
  }

  .btn-primary:hover {
    filter: brightness(1.06);
    box-shadow: 0 12px 34px rgba(201,162,39,.48),
                inset 0 1px 0 rgba(255,255,255,.35);
  }

  /* دکمه کپی — برجسته‌تر با بوردر طلایی */
  .btn-copy {
    min-height: 62px;
    font-size: clamp(16px, 4.6vw, 19px);
    color: var(--brand-dark);
    background: var(--surface);
    border: 1.5px solid var(--warn-border);
    box-shadow: var(--shadow-sm);
  }

  .btn-copy:hover {
    background: var(--warn-bg);
    border-color: var(--brand);
  }

  /* ===== کادر آدرس ===== */
  .url-box {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--surface);
    border: 1px solid #E8E2D4;
    border-radius: var(--radius);
    padding: 16px;
    direction: ltr;
    box-shadow: var(--shadow-sm);
  }

  .url-box input {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: var(--brand-dark);
    font-family: inherit;
    font-size: clamp(16px, 4.6vw, 19px);
    font-weight: 800;
    text-align: center;
    letter-spacing: .4px;
  }

  /* ===== راهنما ===== */
  .hint {
    font-size: clamp(13.5px, 3.8vw, 15px);
    color: var(--text-muted);
    line-height: 2;
    text-align: center;
    padding: 0 6px;
  }

  .hint b {
    color: var(--brand);
    font-weight: 800;
  }

  /* ===== Toast ===== */
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(28px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(20px);
    background: var(--brand);
    color: #FFFFFF;
    padding: 12px 26px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 800;
    opacity: 0;
    pointer-events: none;
    transition: all .3s ease;
    z-index: 999;
    white-space: nowrap;
    box-shadow: 0 8px 22px rgba(201,162,39,.4);
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>

<body>

<div class="wrap">

  <p class="notice">
    پیش از ورود، فیلترشکن خود را خاموش کنید.
  </p>

  <button class="btn btn-primary" id="enterBtn">
    ورود به سایت
  </button>

  <div class="url-box">
    <input
      id="urlInput"
      type="text"
      value="iran98ir.github.io/Job98/"
      readonly
    />
  </div>

  <button class="btn btn-copy" id="copyBtn">
    کپی آدرس سایت
  </button>

  <p class="hint">
    اگر دکمه ورود باز نشد، آدرس بالا را <b>کپی</b> کنید<br>
    و در مرورگر گوشی (کروم / سافاری) باز کنید.
  </p>

</div>

<div class="toast" id="toast">کپی شد</div>

<script>
  /* ===== آدرس سایت ===== */
  var SITE_URL = "https://iran98ir.github.io/Job98/";
  var SITE_URL_CLEAN = "iran98ir.github.io/Job98/";

  var enterBtn = document.getElementById("enterBtn");
  var copyBtn  = document.getElementById("copyBtn");
  var urlInput = document.getElementById("urlInput");
  var toast    = document.getElementById("toast");

  /* ===== تشخیص محیط ===== */
  function isInstagram() {
    return /Instagram/i.test(navigator.userAgent);
  }

  function isTelegram() {
    return /Telegram/i.test(navigator.userAgent);
  }

  function isAndroid() {
    return /Android/i.test(navigator.userAgent);
  }

  function isIOS() {
    return /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  }

  function isInApp() {
    var ua = navigator.userAgent || "";
    return /Instagram|FBAN|FBAV|FB_IAB|Line|Telegram|Twitter|LinkedIn|WhatsApp|Snapchat|Pinterest|MicroMessenger/i.test(ua);
  }

  /* ===== دکمه ورود ===== */
  enterBtn.addEventListener("click", function () {

    /* --- ۱. iOS + Instagram --- */
    if (isIOS() && isInstagram()) {
      var igUrl = "instagram://extbrowser/?url=" + encodeURIComponent(SITE_URL);
      window.location.href = igUrl;

      /* تلاش دوم بعد از تأخیر کوتاه (تکنیک eiab) */
      setTimeout(function () {
        window.location.href = igUrl;
      }, 300);

      /* fallback بعد از ۱.۵ ثانیه */
      setTimeout(function () {
        if (!document.hidden) {
          copyFallback();
        }
      }, 1500);

      return;
    }

    /* --- ۲. iOS + Telegram --- */
    if (isIOS() && isTelegram()) {
      var tgUrl = "tg://openurl?url=" + encodeURIComponent(SITE_URL);
      window.location.href = tgUrl;

      setTimeout(function () {
        window.open(SITE_URL, "_blank");
      }, 800);

      return;
    }

    /* --- ۳. Android + In-App --- */
    if (isAndroid() && isInApp()) {
      var intentUrl =
        "intent://" +
        SITE_URL.replace(/^https?:\/\//, "") +
        "#Intent;scheme=https;package=com.android.chrome;end";

      window.location.href = intentUrl;

      setTimeout(function () {
        window.location.href = SITE_URL;
      }, 800);

      return;
    }

    /* --- ۴. سایر in-app --- */
    if (isInApp()) {
      window.open(SITE_URL, "_blank");
      return;
    }

    /* --- ۵. مرورگر معمولی --- */
    window.open(SITE_URL, "_blank");
  });

  /* ===== fallback کپی ===== */
  function copyFallback() {
    var text = SITE_URL_CLEAN;

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        showToast("آدرس کپی شد — در مرورگر باز کنید");
      }).catch(function () {
        manualCopy(text);
      });
    } else {
      manualCopy(text);
    }
  }

  function manualCopy(text) {
    try {
      urlInput.removeAttribute("readonly");
      urlInput.select();
      urlInput.setSelectionRange(0, 99999);
      document.execCommand("copy");
      urlInput.setAttribute("readonly", "readonly");
      showToast("آدرس کپی شد — در مرورگر باز کنید");
    } catch (e) {
      urlInput.setAttribute("readonly", "readonly");
    }
  }

  /* ===== دکمه کپی ===== */
  copyBtn.addEventListener("click", function () {
    var text = SITE_URL_CLEAN;

    function done() {
      copyBtn.textContent = "کپی شد";
      showToast("آدرس کپی شد");
      setTimeout(function () {
        copyBtn.textContent = "کپی آدرس سایت";
      }, 1800);
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(function () {
        manualCopyDone(text, done);
      });
    } else {
      manualCopyDone(text, done);
    }
  });

  function manualCopyDone(text, cb) {
    try {
      urlInput.removeAttribute("readonly");
      urlInput.select();
      urlInput.setSelectionRange(0, 99999);
      document.execCommand("copy");
      urlInput.setAttribute("readonly", "readonly");
      cb();
    } catch (e) {
      urlInput.setAttribute("readonly", "readonly");
    }
  }

  /* ===== Toast ===== */
  var toastTimer;

  function showToast(msg) {
    if (msg) toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toast.classList.remove("show");
      toast.textContent = "کپی شد";
    }, 2200);
  }

  /* ===== جلوگیری از زوم دو انگشتی ===== */
  document.addEventListener("gesturestart", function (e) {
    e.preventDefault();
  });
</script>

</body>
</html>
