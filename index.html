<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b1220" />
<title>ورود به سایت</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;               /* اسکرول ناپذیر */
    overscroll-behavior: none;
  }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    background: radial-gradient(circle at 20% 0%, #1e293b 0%, #0b1220 55%, #060a13 100%);
    color: #e8eefc;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: calc(16px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom)) 14px;
    min-height: 100dvh;
    height: 100dvh;
  }

  .wrap {
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    gap: clamp(12px, 3vw, 20px);
    animation: fade 0.6s ease;
  }

  @keyframes fade {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ===== کارت پیام خوش‌آمد ===== */
  .hero {
    text-align: center;
    background: linear-gradient(160deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: clamp(16px, 5vw, 26px) clamp(12px, 4vw, 20px);
    box-shadow: 0 12px 30px rgba(0,0,0,0.35);
    backdrop-filter: blur(6px);
  }

  .hero .badge {
    display: inline-block;
    font-size: clamp(11px, 3vw, 13px);
    padding: 5px 12px;
    border-radius: 999px;
    background: linear-gradient(90deg, #f7b733, #fc4a1a);
    color: #1a1200;
    font-weight: 800;
    margin-bottom: clamp(8px, 2.5vw, 12px);
    letter-spacing: 0.2px;
  }

  .hero h1 {
    font-size: clamp(18px, 5.2vw, 26px);
    font-weight: 800;
    line-height: 1.5;
    background: linear-gradient(90deg, #ffffff, #b8c6ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    overflow-wrap: anywhere;
  }

  .hero p {
    margin-top: clamp(6px, 2vw, 10px);
    font-size: clamp(13px, 3.6vw, 16px);
    color: #b7c2d8;
    line-height: 1.8;
    overflow-wrap: anywhere;
  }

  /* ===== دکمه‌ها ===== */
  .btn {
    width: 100%;
    min-height: clamp(54px, 15vw, 66px);
    border: none;
    border-radius: 16px;
    font-family: inherit;
    font-size: clamp(15px, 4.4vw, 19px);
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: transform 0.15s ease, filter 0.2s ease;
    overflow-wrap: anywhere;
    padding: 0 14px;
    text-align: center;
  }

  .btn:active { transform: scale(0.97); }

  .btn-primary {
    color: #08101f;
    background: linear-gradient(135deg, #ffd76e 0%, #f7b733 45%, #fc8a1a 100%);
    box-shadow: 0 10px 26px rgba(247,183,51,0.35), inset 0 1px 0 rgba(255,255,255,0.5);
  }

  .btn-primary:hover { filter: brightness(1.06); }

  .btn-copy {
    color: #e8eefc;
    background: linear-gradient(135deg, #22304d 0%, #16223a 100%);
    border: 1px solid rgba(255,255,255,0.10);
    box-shadow: 0 10px 22px rgba(0,0,0,0.35);
  }

  .btn-copy:hover { filter: brightness(1.1); }

  /* ===== کادر آدرس ===== */
  .url-box {
    display: flex;
    align-items: center;
    background: rgba(255,255,255,0.05);
    border: 1px dashed rgba(255,255,255,0.18);
    border-radius: 14px;
    padding: 12px 14px;
    direction: ltr;
    text-align: center;
    justify-content: center;
  }

  .url-box input {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: #ffe9a8;
    font-family: inherit;
    font-size: clamp(13px, 3.8vw, 16px);
    font-weight: 700;
    text-align: center;
    letter-spacing: 0.3px;
    overflow-wrap: anywhere;
  }

  /* ===== متن راهنما ===== */
  .hint {
    font-size: clamp(11.5px, 3.2vw, 14px);
    color: #93a0b8;
    line-height: 1.9;
    text-align: center;
    padding: 0 4px;
    overflow-wrap: anywhere;
  }

  .hint b { color: #ffd76e; font-weight: 700; }

  /* ===== toast ===== */
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(24px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(20px);
    background: #16a34a;
    color: #fff;
    padding: 10px 20px;
    border-radius: 999px;
    font-size: clamp(12px, 3.5vw, 15px);
    font-weight: 700;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s ease;
    z-index: 999;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="wrap">

  <div class="hero">
    <span class="badge">✨ فرصت ویژه</span>
    <h1>به مقصد رسیدی!</h1>
    <p>همین حالا با یک کلیک وارد شو و از فرصتی که برات آماده شده استفاده کن.</p>
  </div>

  <button class="btn btn-primary" id="enterBtn">🚀 ورود به سایت</button>

  <div class="url-box">
    <input id="urlInput" type="text" value="www.jab.98.ir" readonly />
  </div>

  <button class="btn btn-copy" id="copyBtn">📋 کپی آدرس سایت</button>

  <p class="hint">
    اگر دکمه ورود باز نشد، آدرس بالا را <b>کپی</b> کنید و در مرورگر گوشی (کروم / سافاری) باز کنید.<br>
    در اینستاگرام: منوی <b>⋯</b> → <b>Open in browser</b>
  </p>

</div>

<div class="toast" id="toast">✅ کپی شد!</div>

<script>
  var SITE_URL = "https://www.jab.98.ir";
  var SITE_URL_CLEAN = "www.jab.98.ir";

  var enterBtn = document.getElementById("enterBtn");
  var copyBtn  = document.getElementById("copyBtn");
  var urlInput = document.getElementById("urlInput");
  var toast    = document.getElementById("toast");

  // ==== تشخیص مرورگر داخلی ====
  function isInApp() {
    var ua = navigator.userAgent || navigator.vendor || window.opera;
    return /Instagram|FBAN|FBAV|FB_IAB|Line|Telegram|Twitter|LinkedIn|WhatsApp|Snapchat|Pinterest|MicroMessenger/i.test(ua);
  }

  function isAndroid() { return /Android/i.test(navigator.userAgent); }
  function isIOS() {
    return /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  }

  // ==== دکمه ورود ====
  enterBtn.addEventListener("click", function () {
    var target = SITE_URL;

    // اگر در مرورگر داخلی هستیم
    if (isInApp()) {

      // اندروید → intent به کروم
      if (isAndroid()) {
        var intentUrl = "intent://" + target.replace(/^https?:\/\//, "") +
          "#Intent;scheme=https;package=com.android.chrome;end";
        window.location.href = intentUrl;
        // اگر کروم نبود، fallback
        setTimeout(function () {
          window.location.href = target;
        }, 800);
        return;
      }

      // آیفون → اینستاگرام/تلگرام از extbrowser پشتیبانی می‌کنه
      if (isIOS()) {
        // اینستاگرام
        var igUrl = "instagram://extbrowser/?url=" + encodeURIComponent(target);
        // تلگرام
        var tgUrl = "tg://openurl?url=" + encodeURIComponent(target);

        // امتحان اینستاگرام
        window.location.href = igUrl;

        setTimeout(function () {
          // اگر اینستا باز نشد، تلگرام رو امتحان کن
          window.location.href = tgUrl;
        }, 500);

        setTimeout(function () {
          // آخرین تلاش: باز کردن در تب جدید
          window.open(target, "_blank");
        }, 1200);
        return;
      }

      // سایر حالت‌ها: باز کردن در تب جدید
      window.open(target, "_blank");
      return;
    }

    // مرورگر عادی
    window.open(target, "_blank");
  });

  // ==== دکمه کپی ====
  copyBtn.addEventListener("click", function () {
    var text = SITE_URL_CLEAN;

    function done() {
      copyBtn.textContent = "✅ کپی شد!";
      showToast();
      setTimeout(function () {
        copyBtn.textContent = "📋 کپی آدرس سایت";
      }, 1800);
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(function () {
        fallbackCopy(text, done);
      });
    } else {
      fallbackCopy(text, done);
    }
  });

  function fallbackCopy(text, cb) {
    try {
      urlInput.removeAttribute("readonly");
      urlInput.select();
      urlInput.setSelectionRange(0, 99999);
      document.execCommand("copy");
      urlInput.setAttribute("readonly", "readonly");
      cb();
    } catch (e) {
      urlInput.setAttribute("readonly", "readonly");
    }
  }

  var toastTimer;
  function showToast() {
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toast.classList.remove("show");
    }, 1600);
  }

  // ==== جلوگیری از زوم و کشیدن صفحه ====
  document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
  document.addEventListener("touchmove", function (e) {
    if (e.touches.length > 1) e.preventDefault();
  }, { passive: false });
</script>

</body>
                                     </html>
